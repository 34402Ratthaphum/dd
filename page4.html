<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ผลงาน | Ratthaphum</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            font-size: 40px;
            color: #0077ff;
            margin-bottom: 40px;
        }

        .works {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .work {
            background: #f8f8f8;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .work img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 10px;
        }

        .work h2 {
            font-size: 20px;
            margin-top: 15px;
        }

        .back-button {
            display: inline-block;
            margin-top: 40px;
            padding: 13px 30px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
        }

        .back-button:hover {
            background: #555;
        }

        @media (max-width: 700px) {
            .works {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>ผลงาน</h1>

        <div class="works">

            <!-- รูปที่ 5 -->
            <div class="work">
                <img src="work5.jpg" alt="ผลงานที่ 5">
                <h2>รูปที่ 5</h2>
            </div>

            <!-- รูปที่ 6 -->
            <div class="work">
                <img src="work6.jpg" alt="ผลงานที่ 6">
                <h2>รูปที่ 6</h2>
            </div>

            <!-- รูปที่ 7 -->
            <div class="work">
                <img src="work7.jpg" alt="ผลงานที่ 7">
                <h2>รูปที่ 7</h2>
            </div>

            <!-- รูปที่ 8 -->
            <div class="work">
                <img src="work8.jpg" alt="ผลงานที่ 8">
                <h2>รูปที่ 8</h2>
            </div>

        </div>

        <!-- กลับไปหน้า 3 -->
        <a href="page3.html" class="back-button">
            ← ย้อนกลับ
        </a>

    </div>

</body>
</html>
